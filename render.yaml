services:
  - type: web
    name: study-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GOOGLE_CREDENTIALS_PATH
        value: /etc/secrets/credentials.json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OAUTH_REDIRECT_BASE_URL
        sync: false
      - key: SYNC_INTERVAL_SECONDS
        value: "60"
      # Вебхук вместо polling — не держит соединение с Telegram открытым
      # постоянно, сервис может простаивать между запросами и не тратит
      # часы бесплатного тарифа впустую.
      - key: USE_WEBHOOK
        value: "true"
      # Автогенерируемый Render'ом секрет пути вебхука.
      - key: WEBHOOK_SECRET
        generateValue: true
      # Автогенерируемый пароль для эндпоинта /cron/sync (см. README —
      # его нужно прописать в настройках внешнего крона).
      - key: CRON_SECRET
        generateValue: true
      # Ваш Telegram user_id (числовой) — только этому пользователю будет
      # видна кнопка загрузки учебников. Через запятую — несколько админов.
      - key: ADMIN_IDS
        sync: false
