# "Будит" бесплатный сервис на Render, дёргая его health-check раз в
# 10 минут — Render усыпляет free-сервисы после ~15 минут без входящего
# трафика, и первый запрос после сна ждёт ~30-60 секунд (холодный старт).
# Это НЕ официально поддерживаемый Render способ (см. README), но
# укладывается в бесплатные 750 часов/мес и держит бота отзывчивым.
#
# Как включить:
# 1. Замените RENDER_URL ниже на реальный адрес вашего сервиса
#    (например, https://study-bot-xxxx.onrender.com).
# 2. Закоммитьте этот файл — GitHub Actions подхватит расписание сам,
#    ничего дополнительно настраивать не нужно (Actions включены по
#    умолчанию для публичных и большинства приватных репозиториев).
# 3. Во вкладке Actions репозитория можно проверить, что пинг реально
#    выполняется по расписанию.
name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health-check endpoint
        run: curl -fsS --max-time 30 "${RENDER_URL}/" || true
        env:
          RENDER_URL: https://REPLACE-ME.onrender.com
